title: Henry Freed
description: "Henry Freed's projects and notes: mixture-of-experts research, model pruning and distillation, interpretability, GPUs, and the occasional loaf of bread."
author: ""
remote_theme: "mmistakes/minimal-mistakes@4.27.1"
minimal_mistakes_skin: "sunrise"

plugins:
  - jekyll-include-cache
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-redirect-from
  - jekyll-sitemap

url: "https://hbfreed.com"
og_image: /assets/images/og-default.png

twitter:
  username: hbfreed

social:
  type: Person
  name: Henry Freed
  links:
    - "https://twitter.com/hbfreed"
    - "https://github.com/hbfreed"
    - "https://huggingface.co/hbfreed"

footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/hbfreed"

    - label: "Twitter"
      icon: "fab fa-fw fa-twitter"
      url: "https://twitter.com/hbfreed"

    - label: "Email"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:hbfreed@hbfreed.com"

    - label: "Hugging Face"
      icon: "fa-solid fa-face-laugh-beam"
      url: "https://huggingface.co/hbfreed"

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      show_date: true

sass:
  style: compressed

atom_feed:
  hide: true
